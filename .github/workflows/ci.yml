name: ci

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: dotnet test
        run: dotnet test tests/Sonarr.MetadataProxy.Tests/Sonarr.MetadataProxy.Tests.csproj -c Release

      - name: init scripts (Sonarr v4 + v5 compatibility)
        run: bash scripts/test-init.sh

      - name: entrypoint syntax
        run: sh -n entrypoint.sh

  docker:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check if code changes exist (skip docs-only)
        id: changes
        run: |
          # Diff against the SHA before this push (not just HEAD~1), so a push
          # whose tip commit is a docs merge still sees the code commits below it.
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-list --max-parents=0 HEAD)"
          fi
          CHANGED=$(git diff --name-only "${BEFORE}..HEAD")
          if echo "$CHANGED" | grep -qEv '^(README\.md|\.env\.example|DOCKER_HUB_DESCRIPTION\.txt|docs/|\.github/workflows/(release|dockerhub-description)\.yml)$'; then
            echo "has_code_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code_changes=false" >> "$GITHUB_OUTPUT"
            echo "Only docs/config files changed - skipping Docker build"
          fi

      - name: Set up QEMU
        if: steps.changes.outputs.has_code_changes == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.changes.outputs.has_code_changes == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.changes.outputs.has_code_changes == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.changes.outputs.has_code_changes == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        if: steps.changes.outputs.has_code_changes == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/crisperfx/sonarr-metadata-proxy
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push
        if: steps.changes.outputs.has_code_changes == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}