name: dockerhub-description

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  dockerhub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build overview with changelog
        id: overview
        run: |
          TAG=${GITHUB_REF_NAME#v}
          PREV=$(git describe --tags --exclude="v$TAG" --abbrev=0 HEAD 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then
            git log --format='- %s' HEAD | head -50 > /tmp/changelog.md
          else
            git log --format='- %s' "$PREV..HEAD" | head -50 > /tmp/changelog.md
          fi
          awk '/<!-- CHANGELOG -->/ { while ((getline line < "/tmp/changelog.md") > 0) print line; close("/tmp/changelog.md"); next } { print }' .github/dockerhub-overview.md > /tmp/overview.md
          echo "file=/tmp/overview.md" >> "$GITHUB_OUTPUT"

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: crisperfx/sonarr-metadata-proxy
          readme-filepath: ${{ steps.overview.outputs.file }}