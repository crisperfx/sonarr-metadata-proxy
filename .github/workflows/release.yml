name: release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
          else
            VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/Sonarr.MetadataProxy/Sonarr.MetadataProxy.csproj | head -1)
            VERSION=${VERSION%-dev*}
            VERSION=${VERSION%%+*}
            TAG=v$VERSION
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.tag_name' >/dev/null 2>&1; then
            RET=1
          else
            RET=0
          fi
          echo "exists=$([ $RET -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          PREV=$(git describe --tags --exclude="$TAG" --abbrev=0 "$GITHUB_SHA" 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then
            BODY=$(git log --format='- %s' "$GITHUB_SHA" | head -50)
          else
            BODY=$(git log --format='- %s' "$PREV..$GITHUB_SHA" | head -50)
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          printf '# Sonarr Metadata Proxy v%s\n\n%s\n' "$VERSION" "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false

      - name: Update existing GitHub release
        if: steps.check.outputs.exists == 'true'
        run: |
          printf '%s' "$BODY" > /tmp/notes.md
          gh release edit "$TAG" --notes-file /tmp/notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          BODY: ${{ steps.notes.outputs.body }}

  sync-develop:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check develop has no unique commits
        id: check
        run: |
          git fetch origin develop
          if git merge-base --is-ancestor origin/develop origin/main; then
            echo "syncable=true" >> "$GITHUB_OUTPUT"
          else
            echo "syncable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::develop has commits not in main - skipping sync to avoid losing work"
          fi

      - name: Sync develop to main
        if: steps.check.outputs.syncable == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/Sonarr.MetadataProxy/Sonarr.MetadataProxy.csproj | head -1)
          VERSION=${VERSION%-dev*}
          VERSION=${VERSION%%+*}
          git checkout -B develop origin/develop
          git merge --ff-only origin/main
          sed -i "s|<Version>.*<\/Version>|<Version>${VERSION}-dev</Version>|" src/Sonarr.MetadataProxy/Sonarr.MetadataProxy.csproj
          git add src/Sonarr.MetadataProxy/Sonarr.MetadataProxy.csproj
          git commit -m "chore: sync develop to main; track ${VERSION}-dev"
          git push origin develop