# Dockhand smoke-test stack for the Sonarr Metadata Proxy
#
# Dockhand deploys compose stacks, but (depending on the version) it does not
# build images. Build the image first on the Docker host via SSH:
#
#   cd /volume3/docker/config/sonarr-proxy
#   docker build -t sonarr-metadata-proxy:local .
#
# Then paste this file into Dockhand and fill in a REAL TMDB key.

services:
  sonarr-metadata-proxy:
    image: sonarr-metadata-proxy:local
    container_name: sonarr-metadata-proxy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - METADATA_SOURCE=tmdb
      - TMDB_API_KEY=your-tmdb-v3-api-key
      - ENABLE_TVDB_FALLBACK=true
      - LOG_LEVEL=Information
      - PORT=9697
      - SKIP_TLS=false
      - DATA_DIR=/app/data
    volumes:
      - proxy-data:/app/data
      - certs:/app/data/certs
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "9697:9697"
    networks:
      arrnet:
        aliases:
          - skyhook.sonarr.tv
    expose:
      - "443"
    restart: unless-stopped

volumes:
  proxy-data:
  certs:

networks:
  arrnet:
    driver: bridge