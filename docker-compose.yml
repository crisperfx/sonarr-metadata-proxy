# Sonarr Metadata Proxy – docker compose example.
#
# This wires an UNMODIFIED stock Sonarr to the proxy:
#   - the proxy answers skyhook.sonarr.tv (network alias) and serves TMDB metadata,
#   - the CA install hook makes Sonarr trust the proxy's TLS certificate,
#   - the override-UI hook injects the per-series TMDB/TVDB picker into Sonarr's web UI.
#
# Usage:
#   cp .env.example .env      # set TMDB_API_KEY and CORS_ALLOWED_ORIGINS
#   docker compose up -d
#
# When you build locally, replace the image line with: "build: ."
# When you use the prebuilt image, replace USERNAME with the GitHub account
# owning the repository (image: ghcr.io/USERNAME/sonarr-metadata-proxy:latest).

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./sonarr-data/config:/config
      - ./tv:/tv
      - ./downloads:/downloads
      - certs:/shared/certs:ro
      - ./init/01-install-ca.sh:/custom-cont-init.d/01-install-ca.sh:ro
      - ./init/50-sonarr-override-ui.sh:/custom-cont-init.d/50-sonarr-override-ui.sh:ro
      - ./init:/shared/init:ro
    ports:
      - "8989:8989"
    networks:
      - arrnet
    depends_on:
      sonarr-metadata-proxy:
        condition: service_healthy
    restart: unless-stopped

  sonarr-metadata-proxy:
    image: ghcr.io/USERNAME/sonarr-metadata-proxy:latest
    # build: .   # uncomment to build locally instead of pulling the prebuilt image
    container_name: sonarr-metadata-proxy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    env_file:
      - .env
    volumes:
      - proxy-data:/app/data
      - certs:/app/data/certs
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "9697:9697"
    networks:
      arrnet:
        aliases:
          - skyhook.sonarr.tv
    expose:
      - "443"
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /app/data/certs/ca.crt && curl -fsS http://127.0.0.1:9697/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  proxy-data:
  certs:

networks:
  arrnet:
    driver: bridge